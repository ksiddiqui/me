<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kashif Ali Siddiqui — A Monograph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    /* night-reading (dark) is the default; body.light = paper */
    --paper: #16120d;
    --ink: #e8e0d0;
    --ink-soft: #b0a896;
    --ink-faint: #7d7466;
    --accent: #d4707e;
    --accent-2: #8fb0d4;
    --rule: #383127;
    --drop-bg: rgba(212,112,126,.07);
    --code-bg: #221d16;
    --sel-bg: rgba(212,112,126,.28);
}
body.light {
    --paper: #f7f2e9;
    --ink: #1d1812;
    --ink-soft: #4c4437;
    --ink-faint: #8d8272;
    --accent: #8b2332;
    --accent-2: #2c4a6e;
    --rule: #d9d0bf;
    --drop-bg: rgba(139,35,50,.07);
    --code-bg: #ece5d6;
    --sel-bg: rgba(139,35,50,.18);
}
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:17px;
    line-height:1.75;
    transition:background .4s, color .4s;
}
::selection { background:var(--sel-bg); }
a { color:var(--accent); text-decoration:none; border-bottom:1px solid currentColor; opacity:.9; transition:color .25s, opacity .25s; }
a:hover { color:var(--accent-2); opacity:1; }

/* ---------- masthead ---------- */
.masthead { border-bottom:3px double var(--ink); padding:1.5rem 0 1.1rem; }
.masthead-inner {
    max-width:1180px; margin:0 auto; padding:0 2rem;
    display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:.8rem;
}
.masthead-title { font-family:'Fraunces',serif; font-size:1.7rem; font-weight:900; letter-spacing:.01em; }
.masthead-title em { color:var(--accent); }
.masthead-issue { font-size:.7rem; text-transform:uppercase; letter-spacing:.3em; color:var(--ink-faint); }
.theme-btn {
    background:none; border:1px solid var(--ink); color:var(--ink);
    font-family:'Inter',sans-serif; font-size:.68rem; letter-spacing:.18em; text-transform:uppercase;
    padding:.35rem .95rem; cursor:pointer; transition:background .25s, color .25s;
}
.theme-btn:hover { background:var(--ink); color:var(--paper); }

/* ---------- contents nav ---------- */
.toc-nav {
    max-width:1180px; margin:0 auto; padding:1rem 2rem 1.5rem;
    display:flex; align-items:center; flex-wrap:wrap;
    border-bottom:1px solid var(--rule);
}
.toc-label { font-family:'Fraunces',serif; font-style:italic; font-size:.95rem; color:var(--ink-faint); margin-right:1.6rem; }
.toc-nav a {
    font-size:.76rem; text-transform:uppercase; letter-spacing:.15em;
    color:var(--ink-soft); border:none; padding:.5rem 1rem; position:relative; transition:color .25s;
}
.toc-nav a:hover, .toc-nav a.active { color:var(--accent); }
.toc-nav a.active::after {
    content:''; position:absolute; left:1rem; right:1rem; bottom:-1.55rem; height:3px; background:var(--accent);
}

/* ---------- chapter opener ---------- */
.sheet { max-width:1180px; margin:0 auto; padding:0 2rem 5rem; }
.chap-hero { padding:4.2rem 0 2.8rem; text-align:center; }
.chap-hero::before { content:'❧'; display:block; font-size:1.4rem; color:var(--accent); margin-bottom:1.3rem; }
.chap-num { font-family:'Fraunces',serif; font-style:italic; font-size:1rem; color:var(--ink-faint); letter-spacing:.14em; margin-bottom:.7rem; }
.chap-title { font-family:'Fraunces',serif; font-size:clamp(2.5rem, 6vw, 4.1rem); font-weight:900; line-height:1.06; margin-bottom:1rem; }
.chap-sub { font-family:'Fraunces',serif; font-style:italic; font-size:1.15rem; color:var(--ink-soft); }
.chap-meta { margin-top:1.5rem; font-size:.7rem; text-transform:uppercase; letter-spacing:.3em; color:var(--ink-faint); }

/* ---------- body copy ---------- */
.md { max-width:760px; margin:0 auto; font-size:1.02rem; counter-reset:sec; }
.md::after { content:'❦'; display:block; text-align:center; font-size:1.3rem; color:var(--accent); margin-top:3.4rem; }
.md p { margin:1.15rem 0; }
.md > p:first-of-type::first-letter,
.md > .prose-run:first-of-type > p:first-child::first-letter {
    font-family:'Fraunces',serif; font-size:3.3em; float:left; line-height:.82;
    padding:.07em .13em 0 0; color:var(--accent); font-weight:900;
}
.prose-run { margin:0; }
@media (min-width:1000px) {
    .prose-run { column-count:2; column-gap:3.2rem; text-align:justify; hyphens:auto; }
    .prose-run p { break-inside:avoid-column; }
    .prose-run > p:first-child { margin-top:0; }
}
.md h2 {
    font-family:'Fraunces',serif; font-size:1.85rem; font-weight:900;
    margin:3.8rem 0 1.2rem; padding-top:1.9rem;
    border-top:1px solid var(--rule); position:relative; text-align:center;
}
.md h2::before {
    counter-increment:sec;
    content:counter(sec, decimal-leading-zero);
    font-family:'Fraunces',serif; font-size:.9rem; font-style:italic; font-weight:500;
    color:var(--accent); position:absolute; top:-.85rem; left:50%; transform:translateX(-50%);
    background:var(--paper); padding:0 .8rem;
}
.md h3 { font-family:'Fraunces',serif; font-size:1.3rem; font-weight:700; margin:2.5rem 0 .8rem; }
.md h4 {
    font-family:'Inter',sans-serif; font-size:.8rem; font-weight:700;
    text-transform:uppercase; letter-spacing:.17em; color:var(--ink-soft); margin:2.1rem 0 .6rem;
}
.md ul, .md ol { margin:1.1rem 0 1.1rem 1.4rem; }
.md li { margin:.45rem 0; }
.md li::marker { color:var(--accent); }
.md blockquote {
    margin:2.1rem 0; padding:1.2rem 2rem;
    border-left:3px solid var(--accent); background:var(--drop-bg);
    font-family:'Fraunces',serif; font-style:italic; font-size:1.05rem; color:var(--ink-soft);
}
.md blockquote p { margin:.3rem 0; }
.md code { font-family:ui-monospace,'Cascadia Mono',Consolas,monospace; font-size:.85em; background:var(--code-bg); padding:.15em .45em; border-radius:2px; }
.md pre { background:var(--code-bg); padding:1.2rem 1.4rem; overflow-x:auto; margin:1.5rem 0; border:1px solid var(--rule); }
.md pre code { background:none; padding:0; }
.md table { width:100%; border-collapse:collapse; margin:1.9rem 0; font-size:.9rem; }
.md th {
    font-size:.68rem; text-transform:uppercase; letter-spacing:.15em;
    color:var(--ink-faint); text-align:left; padding:.7rem .9rem; border-bottom:2px solid var(--ink);
}
.md td { padding:.7rem .9rem; border-bottom:1px solid var(--rule); vertical-align:top; }
.md tbody tr:last-child td { border-bottom:2px solid var(--ink); }
.md hr { border:none; border-top:1px solid var(--rule); margin:3rem auto; width:38%; }
.md strong { font-weight:700; }
.md img { max-width:100%; }

/* cards */
.card-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:1.6rem; margin:2rem 0; counter-reset:card; }
.card { border:1px solid var(--rule); padding:1.6rem 1.7rem; position:relative; background:var(--paper); transition:transform .3s, box-shadow .3s; }
.card::before {
    counter-increment:card; content:counter(card, decimal-leading-zero);
    font-family:'Fraunces',serif; font-style:italic; color:var(--accent);
    font-size:.85rem; position:absolute; top:1.1rem; right:1.3rem;
}
.card:hover { transform:translateY(-4px); box-shadow:0 16px 44px -20px rgba(0,0,0,.5); }
.card-meta { font-size:.68rem; text-transform:uppercase; letter-spacing:.2em; color:var(--ink-faint); margin-bottom:.6rem; }
.card-title { font-family:'Fraunces',serif; font-size:1.3rem; font-weight:700; margin-bottom:.7rem; }
.card-content { font-size:.92rem; color:var(--ink-soft); }
.card-content ul { margin:.4rem 0 .4rem 1.2rem; }
.card-tech { margin-top:1rem; font-size:.78rem; font-style:italic; color:var(--accent-2); border-top:1px solid var(--rule); padding-top:.7rem; }

/* skill-grid: h3 subsections + tables */
.skill-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:1.6rem; margin:2rem 0; }
.skill-grid h3 { font-family:'Fraunces',serif; font-size:1.1rem; margin:0 0 .5rem; }
.skill-grid h3 + p { font-size:.92rem; color:var(--ink-soft); margin-top:0; }

@media (max-width:900px) {
    .toc-nav { overflow-x:auto; flex-wrap:nowrap; padding-bottom:1.1rem; }
    .toc-nav a.active::after { display:none; }
    .toc-label { flex-shrink:0; margin-right:1rem; }
    .toc-nav a { padding:.5rem .8rem; flex-shrink:0; }
    .masthead-inner, .sheet { padding-left:1.2rem; padding-right:1.2rem; }
    body { font-size:16px; }
}
.fade-in { animation:fadeUp .55s ease both; }
@keyframes fadeUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
</style>
</head>
<body>
<header class="masthead">
    <div class="masthead-inner">
        <div class="masthead-title">Kashif <em>Siddiqui</em></div>
        <div class="masthead-issue">A Monograph · Vol. I</div>
        <button class="theme-btn" id="theme-btn" onclick="toggleTheme()">Light / Dark</button>
    </div>
</header>
<nav class="toc-nav">
    <span class="toc-label">Contents</span>
    <a href="index.md" class="nav-link" data-page="index.md">Home</a>
    <a href="experiences.md" class="nav-link" data-page="experiences.md">Experience</a>
    <a href="projects.md" class="nav-link" data-page="projects.md">Projects</a>
    <a href="skills.md" class="nav-link" data-page="skills.md">Skills</a>
    <a href="education.md" class="nav-link" data-page="education.md">Education</a>
    <a href="certifications.md" class="nav-link" data-page="certifications.md">Certifications</a>
</nav>
<main class="sheet" id="main"></main>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
const PAGES = {
    'index.md':         { num:'I',   title:'The Author',      sub:'GenAI Transformation Specialist · Islamabad', meta:'Chapter I · Home' },
    'experiences.md':   { num:'II',  title:'Professional Practice', sub:'Ideation → Design → Implementation', meta:'Chapter II · Experience' },
    'projects.md':      { num:'III', title:'The Built Work',  sub:'Things I have built and shipped', meta:'Chapter III · Projects' },
    'skills.md':        { num:'IV',  title:'Instruments',    sub:'Technologies & competencies', meta:'Chapter IV · Skills' },
    'education.md':     { num:'V',   title:'Formation',      sub:'Academic background', meta:'Chapter V · Education' },
    'certifications.md':{ num:'VI',  title:'Credentials',    sub:'Professional certifications', meta:'Chapter VI · Certifications' }
};
function toggleTheme() {
    document.body.classList.toggle('light');
    localStorage.setItem('proto-theme', document.body.classList.contains('light') ? 'light' : 'dark');
}
function wrapProseRuns(mdEl) {
    const groups = [];
    let cur = [];
    [...mdEl.children].forEach(el => {
        if (el.tagName === 'P') { cur.push(el); }
        else { if (cur.length >= 2) groups.push(cur); cur = []; }
    });
    if (cur.length >= 2) groups.push(cur);
    groups.forEach(g => {
        const wrap = document.createElement('div');
        wrap.className = 'prose-run';
        g[0].before(wrap);
        g.forEach(p => wrap.appendChild(p));
    });
}
async function loadPage(page) {
    const main = document.getElementById('main');
    const meta = PAGES[page] || { num:'', title:page, sub:'', meta:'' };
    document.querySelectorAll('.nav-link').forEach(el => el.classList.toggle('active', el.dataset.page === page));
    window.scrollTo({ top:0 });
    main.innerHTML = '<section class="chap-hero fade-in"><div class="chap-num">Loading…</div></section>';
    try {
        const res = await fetch('../pages/' + page);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const text = await res.text();
        const body = marked.parse(
            text.replace(/^#\s.*\n+/, '').replace(/^>\s*\[←.*\n+(>\s*.*\n+)*\n?/, '')
        );
        main.innerHTML =
            '<section class="chap-hero fade-in">' +
              '<div class="chap-num">Chapter ' + meta.num + '</div>' +
              '<h1 class="chap-title">' + meta.title + '</h1>' +
              (meta.sub ? '<div class="chap-sub">' + meta.sub + '</div>' : '') +
              '<div class="chap-meta"><span>' + meta.meta + '</span></div>' +
            '</section>' +
            '<div class="md fade-in">' + body + '</div>';
        wrapProseRuns(main.querySelector('.md'));
    } catch (err) {
        main.innerHTML = '<section class="chap-hero"><h1 class="chap-title">Error</h1><div class="chap-sub">Could not load ' + page + ' (' + err.message + '). Serve the repo root with <strong>python -m http.server 8000</strong>, then open http://localhost:8000/prototypes/monograph.html</div></section>';
    }
}
document.addEventListener('DOMContentLoaded', () => {
    if (localStorage.getItem('proto-theme') === 'light') document.body.classList.add('light');
    document.querySelectorAll('.nav-link').forEach(el => el.addEventListener('click', e => { e.preventDefault(); loadPage(el.dataset.page); }));
    document.getElementById('main').addEventListener('click', e => {
        const a = e.target.closest('a[href$=".md"]');
        if (!a) return;
        e.preventDefault();
        loadPage(a.getAttribute('href').replace(/^\.\//, ''));
    });
    loadPage('index.md');
});
</script>
</body>
</html>
