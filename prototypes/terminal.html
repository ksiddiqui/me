<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kashif@genai:~$ cat profile — Kashif Ali Siddiqui</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
    --bg:#0a0d12; --bg-alt:#0d1117; --panel:#0c1017; --panel-alt:#10151d;
    --green:#00ff88; --green-dim:#00cc6d; --cyan:#38d9ff; --amber:#ffb454; --magenta:#ff5c8a;
    --fg:#c9d4e0; --fg-dim:#7a8699; --fg-bright:#eef4fb;
    --border:#1c2530; --border-glow:rgba(0,255,136,.25);
    --code-bg:#0e131b;
}
html { scroll-behavior:smooth; }
body {
    background:var(--bg); color:var(--fg);
    font-family:'JetBrains Mono', 'Fira Code', monospace;
    font-size:15px; line-height:1.7; min-height:100vh;
    background-image:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(0,255,136,.05), transparent),
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,.008) 3px);
}
/* ===== TOP PROMPT BAR ===== */
.prompt-bar {
    position:sticky; top:0; z-index:50;
    background:rgba(10,13,18,.92); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
    padding:.8rem 1.5rem; display:flex; align-items:center; gap:.75rem; flex-wrap:wrap;
}
.prompt-bar .user { color:var(--green); font-weight:700; }
.prompt-bar .at { color:var(--fg-dim); }
.prompt-bar .host { color:var(--cyan); font-weight:700; }
.prompt-bar .path { color:var(--amber); }
.prompt-bar .dollar { color:var(--fg-dim); }
.prompt-bar .cmd { color:var(--fg-bright); }
.cursor-block {
    display:inline-block; width:9px; height:1.15em; background:var(--green);
    vertical-align:text-bottom; animation:blink 1.1s steps(1) infinite;
}
@keyframes blink { 50% { opacity:0; } }
.prompt-bar .spacer { flex:1; }
.theme-btn {
    background:transparent; border:1px solid var(--border); color:var(--fg-dim);
    font-family:inherit; font-size:.72rem; padding:.35rem .9rem; border-radius:6px;
    cursor:pointer; transition:all .2s; letter-spacing:.5px;
}
.theme-btn:hover { border-color:var(--green); color:var(--green); box-shadow:0 0 12px var(--border-glow); }
/* ===== LAYOUT ===== */
.shell { display:grid; grid-template-columns:260px 1fr; gap:0; max-width:1500px; margin:0 auto; min-height:calc(100vh - 60px); }
/* ===== SIDEBAR (ls) ===== */
.cmd-list {
    border-right:1px solid var(--border); padding:1.75rem 1.25rem;
    background:var(--panel); position:sticky; top:61px; height:calc(100vh - 61px); overflow-y:auto;
}
.cmd-list .ls-label { color:var(--fg-dim); font-size:.75rem; margin-bottom:1.25rem; letter-spacing:1px; }
.cmd-list .ls-label::before { content:'$ '; color:var(--green); }
.cmd-item {
    display:flex; align-items:baseline; gap:.6rem; padding:.5rem .75rem; margin-bottom:.15rem;
    border-radius:6px; cursor:pointer; transition:all .15s; border:1px solid transparent;
    color:var(--fg); text-decoration:none; font-size:.85rem;
}
.cmd-item .ext { color:var(--cyan); font-size:.75rem; min-width:2.2rem; }
.cmd-item:hover { background:rgba(0,255,136,.06); border-color:var(--border); }
.cmd-item.active { background:rgba(0,255,136,.09); border-color:var(--border-glow); color:var(--green); }
.cmd-item.active .ext { color:var(--green-dim); }
.cmd-list .divider { color:var(--fg-dim); font-size:.75rem; margin:1.75rem 0 .75rem; opacity:.6; }
.social-link { display:block; color:var(--fg-dim); text-decoration:none; font-size:.78rem; padding:.35rem .75rem; border-radius:4px; }
.social-link:hover { color:var(--cyan); background:rgba(56,217,255,.06); }
.social-link::before { content:'↗ '; color:var(--green); }
/* ===== MAIN ===== */
.main { padding:2.5rem 3rem 5rem; max-width:980px; }
/* typed hero */
.hero-cmd { color:var(--fg-dim); font-size:.85rem; margin-bottom:.5rem; }
.hero-cmd .p { color:var(--green); }
.hero-name {
    font-family:'Space Grotesk','JetBrains Mono',monospace;
    font-size:clamp(2rem,5vw,3.4rem); font-weight:700; color:var(--fg-bright);
    margin-bottom:.35rem; line-height:1.15;
}
.hero-name .blink-cursor { color:var(--green); }
.hero-tag { color:var(--green); font-size:1.02rem; margin-bottom:.75rem; letter-spacing:.5px; }
.hero-loc { color:var(--fg-dim); font-size:.85rem; }
.hero-loc::before { content:'# '; color:var(--magenta); }
/* ===== MARKDOWN ===== */
.md { margin-top:2.5rem; }
.md h1 { font-family:'Space Grotesk',sans-serif; font-size:1.9rem; color:var(--fg-bright); margin:2.75rem 0 1.1rem; }
.md h1::before { content:'## '; color:var(--green); font-family:'JetBrains Mono',monospace; font-size:1.1rem; }
.md h2 { font-family:'Space Grotesk',sans-serif; font-size:1.45rem; color:var(--fg-bright); margin:2.5rem 0 1rem; }
.md h2::before { content:'## '; color:var(--green); font-family:'JetBrains Mono',monospace; font-size:.95rem; }
.md h3 { font-size:1.12rem; color:var(--cyan); margin:2rem 0 .8rem; font-weight:500; }
.md h3::before { content:'### '; color:var(--green-dim); font-size:.85rem; }
.md h4 { color:var(--amber); margin:1.5rem 0 .6rem; font-size:.95rem; }
.md p { margin:1rem 0; color:var(--fg); }
.md strong { color:var(--fg-bright); font-weight:700; }
.md em { color:var(--cyan); font-style:italic; }
.md a { color:var(--cyan); text-decoration:none; border-bottom:1px dashed rgba(56,217,255,.4); }
.md a:hover { color:var(--green); border-bottom-color:var(--green); }
.md ul, .md ol { margin:1rem 0 1rem .25rem; list-style:none; }
.md ul li { position:relative; padding-left:1.6rem; margin:.55rem 0; color:var(--fg); }
.md ul li::before { content:'▸'; position:absolute; left:.35rem; color:var(--green); }
.md ol { counter-reset:term; }
.md ol li { position:relative; padding-left:2.1rem; margin:.55rem 0; counter-increment:term; }
.md ol li::before { content:counter(term) '.'; position:absolute; left:.4rem; color:var(--amber); font-weight:700; }
.md blockquote { border-left:2px solid var(--green); background:rgba(0,255,136,.04); padding:1rem 1.25rem; margin:1.5rem 0; border-radius:0 8px 8px 0; }
.md blockquote p { margin:.35rem 0; color:var(--fg-dim); }
.md code { background:rgba(0,255,136,.08); color:var(--green); padding:.15rem .45rem; border-radius:4px; font-size:.85em; border:1px solid rgba(0,255,136,.12); }
.md pre { background:var(--code-bg); border:1px solid var(--border); border-radius:10px; padding:1.25rem; margin:1.5rem 0; overflow-x:auto; position:relative; }
.md pre::before { content:'output'; position:absolute; top:.5rem; right:.9rem; font-size:.65rem; color:var(--fg-dim); letter-spacing:1px; }
.md pre code { background:transparent; border:none; color:var(--fg); padding:0; }
.md table { width:100%; border-collapse:collapse; margin:1.5rem 0; font-size:.88rem; }
.md th { text-align:left; color:var(--green); border-bottom:2px solid var(--border-glow); padding:.6rem .8rem; font-weight:700; font-size:.78rem; text-transform:uppercase; letter-spacing:.8px; }
.md td { padding:.6rem .8rem; border-bottom:1px solid var(--border); color:var(--fg); }
.md tr:hover td { background:rgba(0,255,136,.03); }
.md hr { border:none; height:1px; background:repeating-linear-gradient(90deg,var(--border) 0 8px,transparent 8px 16px); margin:2.5rem 0; }
/* cards (from .card-grid in md) */
.md .card-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:1.1rem; margin:1.75rem 0; }
.md .card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:1.35rem; transition:all .2s; position:relative; overflow:hidden; }
.md .card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--green),transparent); opacity:0; transition:opacity .2s; }
.md .card:hover { border-color:var(--border-glow); transform:translateY(-2px); box-shadow:0 8px 30px rgba(0,255,136,.07); }
.md .card:hover::before { opacity:1; }
.md .card-meta { display:inline-block; color:var(--cyan); font-size:.68rem; text-transform:uppercase; letter-spacing:1.5px; margin-bottom:.6rem; }
.md .card-title { font-family:'Space Grotesk',sans-serif; color:var(--fg-bright); font-size:1.05rem; font-weight:700; margin-bottom:.5rem; }
.md .card-content { color:var(--fg); font-size:.86rem; margin-bottom:.8rem; }
.md .card-tech { color:var(--green-dim); font-size:.78rem; border-top:1px dashed var(--border); padding-top:.6rem; }
/* footer */
.term-footer { border-top:1px solid var(--border); padding:1.25rem 3rem; color:var(--fg-dim); font-size:.75rem; text-align:center; }
.term-footer .p { color:var(--green); }
/* loading */
.boot { padding:3rem 1rem; color:var(--fg-dim); }
.boot .line { margin:.4rem 0; }
.boot .ok { color:var(--green); }
/* light theme */
body.light {
    --bg:#f4f2ec; --bg-alt:#ece9e0; --panel:#faf9f5; --panel-alt:#f0ede6;
    --green:#00884a; --green-dim:#006b3c; --cyan:#0369a1; --amber:#b45309; --magenta:#be185d;
    --fg:#333a45; --fg-dim:#6b7280; --fg-bright:#111827;
    --border:#d9d4c8; --border-glow:rgba(0,136,74,.3); --code-bg:#ece9e0;
    background-image:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.012) 3px);
}
body.light .prompt-bar { background:rgba(244,242,236,.92); }
@media (max-width:900px) {
    .shell { grid-template-columns:1fr; }
    .cmd-list { position:static; height:auto; border-right:none; border-bottom:1px solid var(--border); display:flex; flex-wrap:wrap; gap:.25rem; padding:1rem; }
    .cmd-list .ls-label, .cmd-list .divider { width:100%; }
    .cmd-item { flex:0 0 auto; }
    .social-link { display:inline-block; }
    .main { padding:2rem 1.25rem 4rem; }
}
</style>
</head>
<body>
<div class="prompt-bar">
    <span><span class="user">kashif</span><span class="at">@</span><span class="host">genai</span>:<span class="path">~</span><span class="dollar">$</span> <span class="cmd" id="cmd-display">cat index.md</span></span>
    <span class="cursor-block"></span>
    <span class="spacer"></span>
    <button class="theme-btn" onclick="toggleTheme()">[ theme: dark ]</button>
</div>

<div class="shell">
    <nav class="cmd-list">
        <div class="ls-label">ls pages/</div>
        <a class="cmd-item active" data-page="index.md" onclick="loadPage('index.md'); return false;"><span class="ext">md</span>index.md</a>
        <a class="cmd-item" data-page="experiences.md" onclick="loadPage('experiences.md'); return false;"><span class="ext">md</span>experiences.md</a>
        <a class="cmd-item" data-page="projects.md" onclick="loadPage('projects.md'); return false;"><span class="ext">md</span>projects.md</a>
        <a class="cmd-item" data-page="skills.md" onclick="loadPage('skills.md'); return false;"><span class="ext">md</span>skills.md</a>
        <a class="cmd-item" data-page="education.md" onclick="loadPage('education.md'); return false;"><span class="ext">md</span>education.md</a>
        <a class="cmd-item" data-page="certifications.md" onclick="loadPage('certifications.md'); return false;"><span class="ext">md</span>certifications.md</a>
        <div class="divider">external links</div>
        <a class="social-link" href="https://www.linkedin.com/in/ksiddiqui/" target="_blank" rel="noopener">linkedin/in/ksiddiqui</a>
        <a class="social-link" href="https://github.com/ksiddiqui" target="_blank" rel="noopener">github/ksiddiqui</a>
        <a class="social-link" href="mailto:kashif.ali.siddiqui@gmail.com">kashif.ali.siddiqui@gmail</a>
    </nav>

    <main class="main">
        <div id="content"><div class="boot"><div class="line">$ initializing...</div></div></div>
    </main>
</div>

<div class="term-footer">
    <span class="p">kashif@genai</span> © 2026 · rendered from raw markdown · <a href="https://www.linkedin.com/in/ksiddiqui/" target="_blank" rel="noopener" style="color:var(--cyan);text-decoration:none;">linkedin ↗</a>
</div>

<script>
const PAGES = {
    'index.md':        { cmd:'cat index.md',        hero:'Kashif Ali Siddiqui', tag:'GenAI • Architecture • Cloud', loc:'Islamabad, Pakistan' },
    'experiences.md':  { cmd:'cat experiences.md',  hero:'Professional Experience', tag:'Ideation → Design → Implementation', loc:'2015 — Present' },
    'projects.md':     { cmd:'cat projects.md',     hero:'Projects', tag:'Things I have built', loc:'github.com/ksiddiqui' },
    'skills.md':       { cmd:'cat skills.md',       hero:'Skills', tag:'Technologies & competencies', loc:'uptime: 11+ years' },
    'education.md':    { cmd:'cat education.md',    hero:'Education', tag:'Academic background', loc:'NED University · ISB' },
    'certifications.md':{ cmd:'cat certifications.md', hero:'Certifications', tag:'Professional credentials', loc:'AWS · Azure · GCP' }
};

function toggleTheme() {
    document.body.classList.toggle('light');
    const btn = document.querySelector('.theme-btn');
    const light = document.body.classList.contains('light');
    btn.textContent = light ? '[ theme: light ]' : '[ theme: dark ]';
    localStorage.setItem('proto-theme', light ? 'light' : 'dark');
}

async function loadPage(page) {
    const content = document.getElementById('content');
    const meta = PAGES[page] || { cmd:'cat '+page, hero:page, tag:'', loc:'' };
    document.getElementById('cmd-display').textContent = meta.cmd;
    document.querySelectorAll('.cmd-item').forEach(el => el.classList.toggle('active', el.dataset.page === page));
    window.scrollTo({top:0});
    content.innerHTML = '<div class="boot"><div class="line">$ fetching pages/' + page + ' ...</div></div>';
    try {
        const res = await fetch('../pages/' + page);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const text = await res.text();
        const body = marked.parse(text);
        const heroBlock =
            '<div class="hero-cmd"><span class="p">$</span> whoami</div>' +
            '<h1 class="hero-name">' + meta.hero + '<span class="blink-cursor">_</span></h1>' +
            (meta.tag ? '<div class="hero-tag">' + meta.tag + '</div>' : '') +
            (meta.loc ? '<div class="hero-loc">' + meta.loc + '</div>' : '');
        content.innerHTML = heroBlock + '<div class="md">' + body + '</div>';
    } catch (err) {
        content.innerHTML = '<div class="boot"><div class="line">fetch: <span style="color:#ff5c8a">' + err.message + '</span></div><div class="line">$ serve the repo first: <span style="color:var(--amber)">python -m http.server 8000</span> from repo root, then open <span style="color:var(--cyan)">http://localhost:8000/prototypes/terminal.html</span></div></div>';
    }
}

document.addEventListener('DOMContentLoaded', () => {
    if (localStorage.getItem('proto-theme') === 'light') toggleTheme();
    document.getElementById('content').addEventListener('click', e => {
        const a = e.target.closest('a[href$=".md"]');
        if (!a) return;
        e.preventDefault();
        loadPage(a.getAttribute('href').replace(/^\.\//, ''));
    });
    loadPage('index.md');
});
</script>
</body>
</html>
