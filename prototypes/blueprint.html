<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kashif Ali Siddiqui — Architectural Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
    /* Dark = classic blueprint (white ink on Prussian blue); Light = pencil on cream */
    --sheet: #0d2137;
    --sheet-2: #0a1a2c;
    --ink: #d7e6f2;
    --ink-soft: #9db8cf;
    --ink-faint: #5f7b94;
    --accent: #ffd23f;
    --accent-2: #64d2ff;
    --grid: rgba(100,210,255,.07);
    --grid-strong: rgba(100,210,255,.13);
    --frame: rgba(215,230,242,.55);
    --panel: rgba(13,33,55,.75);
}
body.light {
    --sheet: #f2ead8;
    --sheet-2: #e9dfc8;
    --ink: #1c2f42;
    --ink-soft: #3d5570;
    --ink-faint: #7a8ba0;
    --accent: #b3541e;
    --accent-2: #1f5f8b;
    --grid: rgba(28,47,66,.07);
    --grid-strong: rgba(28,47,66,.14);
    --frame: rgba(28,47,66,.55);
    --panel: rgba(242,234,216,.85);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
    background:var(--sheet);
    background-image:
        linear-gradient(var(--grid-strong) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-strong) 1px, transparent 1px),
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:16px;
    line-height:1.7;
    transition:background-color .4s, color .4s;
    min-height:100vh;
}
::selection { background:var(--accent); color:var(--sheet); }
a { color:var(--accent-2); text-decoration:none; border-bottom:1px dashed currentColor; }
a:hover { color:var(--accent); border-bottom-style:solid; }

/* ---------- title strip ---------- */
.title-strip {
    border-bottom:2px solid var(--frame);
    background:var(--sheet-2);
}
.title-strip-inner {
    max-width:1280px; margin:0 auto; padding:.9rem 2rem;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:.6rem;
}
.brand {
    font-family:'Archivo Black',sans-serif;
    font-size:1.15rem;
    letter-spacing:.04em;
    text-transform:uppercase;
}
.brand small { font-family:'Space Mono',monospace; font-size:.68rem; font-weight:400; color:var(--ink-faint); margin-left:.7rem; letter-spacing:.18em; }
.theme-btn {
    background:none; border:1.5px solid var(--ink); color:var(--ink);
    font-family:'Space Mono',monospace; font-size:.68rem; letter-spacing:.14em; text-transform:uppercase;
    padding:.4rem 1rem; cursor:pointer; transition:all .25s;
}
.theme-btn:hover { background:var(--accent); border-color:var(--accent); color:var(--sheet-2); }

/* ---------- nav bar ---------- */
.nav-bar {
    background:var(--sheet-2);
    border-bottom:2px solid var(--frame);
}
.nav-bar-inner {
    max-width:1280px; margin:0 auto; padding:0 2rem;
    display:flex; align-items:stretch; gap:0; overflow-x:auto;
}
.nav-link {
    font-family:'Space Mono',monospace;
    font-size:.74rem; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink-soft); border:none;
    padding:.85rem 1.3rem; flex-shrink:0; position:relative;
    transition:color .2s;
}
.nav-link::before { content:'§ '; color:var(--ink-faint); }
.nav-link:hover { color:var(--accent-2); }
.nav-link.active { color:var(--accent); }
.nav-link.active::after {
    content:''; position:absolute; left:0; right:0; top:0; height:3px; background:var(--accent);
}

/* ---------- drawing frame ---------- */
.drawing-frame {
    max-width:1280px; margin:2.2rem auto 6rem; padding:0 2rem;
}
.sheet-inner {
    border:2px solid var(--frame);
    position:relative;
    background:color-mix(in srgb, var(--sheet) 72%, transparent);
    padding:3.2rem 2.6rem 3.6rem;
    min-height:60vh;
}
.sheet-inner::before, .sheet-inner::after {
    content:''; position:absolute; width:26px; height:26px; border:2px solid var(--frame);
}
.sheet-inner::before { top:-13px; left:-13px; border-right:none; border-bottom:none; }
.sheet-inner::after { bottom:-13px; right:-13px; border-left:none; border-top:none; }

/* corner registration marks */
.reg-mark { position:absolute; font-family:'Space Mono',monospace; font-size:.62rem; color:var(--ink-faint); letter-spacing:.14em; }
.reg-tl { top:.8rem; left:1rem; }
.reg-tr { top:.8rem; right:1rem; }

/* ---------- stamp header per page ---------- */
.stamp {
    display:flex; align-items:baseline; gap:1.4rem; flex-wrap:wrap;
    border-bottom:1.5px dashed var(--frame);
    padding-bottom:1.6rem; margin-bottom:2.6rem;
}
.stamp-label {
    font-family:'Archivo Black',sans-serif;
    font-size:clamp(1.9rem, 4.5vw, 3rem);
    text-transform:uppercase; line-height:1.05; letter-spacing:.01em;
}
.stamp-label .dim { color:var(--accent); }
.stamp-sub { font-family:'Space Mono',monospace; font-size:.78rem; color:var(--ink-soft); letter-spacing:.08em; }
.stamp-right { margin-left:auto; text-align:right; }
.stamp-right .no { font-family:'Archivo Black',sans-serif; font-size:1.6rem; color:var(--accent); }
.stamp-right .cap { font-family:'Space Mono',monospace; font-size:.62rem; color:var(--ink-faint); letter-spacing:.2em; text-transform:uppercase; }

/* ---------- content ---------- */
.md { max-width:900px; margin:0 auto; }
.md h2 {
    font-family:'Archivo Black',sans-serif;
    font-size:1.3rem; text-transform:uppercase; letter-spacing:.05em;
    margin:3rem 0 1rem; padding-bottom:.5rem;
    border-bottom:1.5px solid var(--frame);
    display:flex; align-items:baseline; gap:.8rem;
}
.md h2::before { content:'//'; font-family:'Space Mono',monospace; color:var(--accent); font-size:1rem; }
.md h3 {
    font-family:'Archivo Black',sans-serif;
    font-size:.98rem; text-transform:uppercase; letter-spacing:.06em;
    margin:2.2rem 0 .7rem; color:var(--ink);
}
.md h3::before { content:'▸ '; color:var(--accent-2); }
.md h4 {
    font-family:'Space Mono',monospace; font-size:.72rem; text-transform:uppercase;
    letter-spacing:.16em; color:var(--ink-faint); margin:1.8rem 0 .5rem;
}
.md p { margin:1rem 0; color:var(--ink-soft); }
.md ul, .md ol { margin:1rem 0 1rem 1.3rem; }
.md li { margin:.4rem 0; color:var(--ink-soft); }
.md li::marker { content:'— '; color:var(--accent); font-family:'Space Mono',monospace; }
.md blockquote {
    margin:2rem 0; padding:1rem 1.4rem;
    border:1.5px dashed var(--frame);
    background:var(--panel);
    font-family:'Space Mono',monospace; font-size:.85rem; color:var(--ink-soft);
    position:relative;
}
.md blockquote::before {
    content:'NOTE:'; position:absolute; top:-.62rem; left:1rem;
    background:var(--sheet); color:var(--accent); font-size:.62rem;
    letter-spacing:.2em; padding:0 .5rem;
}
.md code { font-family:'Space Mono',monospace; font-size:.82em; color:var(--accent); background:rgba(0,0,0,.18); padding:.12em .4em; }
body.light .md code { background:rgba(28,47,66,.08); }
.md pre { background:rgba(0,0,0,.25); border:1px solid var(--frame); padding:1.2rem 1.3rem; overflow-x:auto; margin:1.5rem 0; }
body.light .md pre { background:rgba(28,47,66,.06); }
.md pre code { color:var(--ink-soft); background:none; padding:0; }
.md table { width:100%; border-collapse:collapse; margin:1.8rem 0; font-size:.88rem; }
.md th {
    font-family:'Space Mono',monospace; font-size:.66rem; text-transform:uppercase; letter-spacing:.16em;
    color:var(--ink-faint); text-align:left; padding:.65rem .85rem;
    border-bottom:2px solid var(--accent);
}
.md td { padding:.65rem .85rem; border-bottom:1px dashed var(--frame); vertical-align:top; color:var(--ink-soft); }
.md td:first-child { color:var(--ink); font-weight:500; }
.md hr { border:none; border-top:1.5px dashed var(--frame); margin:2.6rem 0; }
.md strong { color:var(--ink); font-weight:700; }
.md img { max-width:100%; border:1px solid var(--frame); }

/* cards */
.card-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:1.4rem; margin:2rem 0; }
.card {
    border:1.5px solid var(--frame); background:var(--panel);
    padding:1.5rem 1.5rem 1.3rem; position:relative;
}
.card::after {
    content:''; position:absolute; top:8px; right:8px; width:10px; height:10px;
    border:1.5px solid var(--accent); transform:rotate(45deg);
}
.card-meta {
    font-family:'Space Mono',monospace; font-size:.64rem; text-transform:uppercase;
    letter-spacing:.18em; color:var(--accent-2); margin-bottom:.55rem;
}
.card-title { font-family:'Archivo Black',sans-serif; font-size:1.05rem; text-transform:uppercase; letter-spacing:.03em; margin-bottom:.6rem; }
.card-content { font-size:.9rem; color:var(--ink-soft); }
.card-content ul { margin-left:1.1rem; }
.card-tech { margin-top:.9rem; font-family:'Space Mono',monospace; font-size:.72rem; color:var(--ink-faint); border-top:1px dashed var(--frame); padding-top:.6rem; }

/* skill-grid */
.skill-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:1.4rem; margin:2rem 0; }
.skill-grid h3 { margin:0 0 .5rem; }
.skill-grid h3 + p { font-size:.9rem; color:var(--ink-soft); margin-top:0; }

/* ---------- title block (drawing-sheet chrome, bottom-right) ---------- */
.titleblock {
    margin-top:3.5rem;
    border:2px solid var(--frame);
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    font-family:'Space Mono',monospace;
    font-size:.68rem;
    overflow:hidden;
}
.titleblock div { padding:.7rem .9rem; border-right:1px solid var(--frame); border-bottom:1px solid var(--frame); }
.titleblock div:last-child { border-right:none; }
.titleblock .k { display:block; font-size:.58rem; color:var(--ink-faint); letter-spacing:.2em; text-transform:uppercase; }
.titleblock .v { color:var(--ink); font-size:.78rem; margin-top:.15rem; }
.titleblock .v.hl { color:var(--accent); font-weight:700; }

@media (max-width:900px) {
    .drawing-frame { margin:1.2rem auto 4rem; padding:0 .9rem; }
    .sheet-inner { padding:2.2rem 1.3rem 2.6rem; }
    .title-strip-inner, .nav-bar-inner { padding-left:1rem; padding-right:1rem; }
}
.fade-in { animation:fadeUp .5s ease both; }
@keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
</style>
</head>
<body>
<header class="title-strip">
    <div class="title-strip-inner">
        <div class="brand">K. A. Siddiqui<small>ARCH. PORTFOLIO — GENAI / CLOUD</small></div>
        <button class="theme-btn" onclick="toggleTheme()">Neg / Pos</button>
    </div>
</header>
<nav class="nav-bar">
    <div class="nav-bar-inner">
        <a href="index.md" class="nav-link" data-page="index.md">Home</a>
        <a href="experiences.md" class="nav-link" data-page="experiences.md">Experience</a>
        <a href="projects.md" class="nav-link" data-page="projects.md">Projects</a>
        <a href="skills.md" class="nav-link" data-page="skills.md">Skills</a>
        <a href="education.md" class="nav-link" data-page="education.md">Education</a>
        <a href="certifications.md" class="nav-link" data-page="certifications.md">Certs</a>
    </div>
</nav>
<div class="drawing-frame">
    <main class="sheet-inner" id="main">
        <span class="reg-mark reg-tl">DWG. KS-2026</span>
        <span class="reg-mark reg-tr">SCALE NTS</span>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
const PAGES = {
    'index.md':         { no:'S-01', label:'The Architect',      sub:'GenAI Transformation Specialist · Islamabad' },
    'experiences.md':   { no:'S-02', label:'Experience',        sub:'Professional practice 2015 — Present' },
    'projects.md':      { no:'S-03', label:'Projects',           sub:'Built work & open source' },
    'skills.md':       { no:'S-04', label:'Skills',             sub:'Instruments & competencies' },
    'education.md':     { no:'S-05', label:'Education',          sub:'Formation & training' },
    'certifications.md':{ no:'S-06', label:'Certifications',     sub:'Verified credentials' }
};
function toggleTheme() {
    document.body.classList.toggle('light');
    localStorage.setItem('proto-theme', document.body.classList.contains('light') ? 'light' : 'dark');
}
async function loadPage(page) {
    const main = document.getElementById('main');
    const meta = PAGES[page] || { no:'S-??', label:page, sub:'' };
    document.querySelectorAll('.nav-link').forEach(el => el.classList.toggle('active', el.dataset.page === page));
    window.scrollTo({ top:0 });
    const marks = '<span class="reg-mark reg-tl">DWG. KS-2026</span><span class="reg-mark reg-tr">SCALE NTS</span>';
    main.innerHTML = marks + '<div class="stamp fade-in"><div class="stamp-label">Loading<span class="dim">…</span></div></div>';
    try {
        const res = await fetch('../pages/' + page);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const text = await res.text();
        const body = marked.parse(
            text.replace(/^#\s.*\n+/, '').replace(/^>\s*\[←.*\n+(>\s*.*\n+)*\n?/, '')
        );
        main.innerHTML =
            marks +
            '<div class="stamp fade-in">' +
              '<div><div class="stamp-label">' + meta.label + '<span class="dim">.</span></div>' +
              (meta.sub ? '<div class="stamp-sub">' + meta.sub + '</div>' : '') + '</div>' +
              '<div class="stamp-right"><div class="no">' + meta.no + '</div><div class="cap">Sheet</div></div>' +
            '</div>' +
            '<div class="md fade-in">' + body + '</div>' +
            titleblock(page);
    } catch (err) {
        main.innerHTML = marks + '<div class="stamp"><div><div class="stamp-label">Error</div><div class="stamp-sub">Could not load ' + page + ' (' + err.message + '). Serve repo root: python -m http.server 8000 → http://localhost:8000/prototypes/blueprint.html</div></div></div>';
    }
}
function titleblock(page) {
    const rows = [
        ['Drawn by', 'Kashif Ali Siddiqui'],
        ['Checked', 'GenAI Transformation'],
        ['Project', 'Personal Portfolio'],
        ['Location', 'Islamabad, Pakistan']
    ];
    const date = new Date().toLocaleDateString('en-GB');
    const idx = Object.keys(PAGES).indexOf(page);
    const no = idx >= 0 ? PAGES[page].no : 'S-??';
    const cells = rows.map(r => '<div><span class="k">' + r[0] + '</span><span class="v">' + r[1] + '</span></div>').join('') +
        '<div><span class="k">Date</span><span class="v">' + date + '</span></div>' +
        '<div><span class="k">Sheet</span><span class="v hl">' + no + ' / 06</span></div>' +
        '<div><span class="k">Rev</span><span class="v hl">A</span></div>' +
        '<div><span class="k">Scale</span><span class="v">NTS</span></div>';
    return '<div class="titleblock">' + cells + '</div>';
}
document.addEventListener('DOMContentLoaded', () => {
    if (localStorage.getItem('proto-theme') === 'light') document.body.classList.add('light');
    document.querySelectorAll('.nav-link').forEach(el => el.addEventListener('click', e => { e.preventDefault(); loadPage(el.dataset.page); }));
    document.getElementById('main').addEventListener('click', e => {
        const a = e.target.closest('a[href$=".md"]');
        if (!a) return;
        e.preventDefault();
        loadPage(a.getAttribute('href').replace(/^\.\//, ''));
    });
    loadPage('index.md');
});
</script>
</body>
</html>
